<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create tape</title>
    <link rel="icon" type="image/png" href="../../assets/stickers/50af036d.png" />
    <link rel="stylesheet" href="../../css/hero.css" />
    <style>
      body {
        color: #f4efe8;
        font: 13px/1.3 system-ui, sans-serif;
      }

      .ed-bar {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 0 14px;
        background: rgba(28, 25, 22, 0.92);
        border: 1px solid #2e2924;
        border-radius: 10px;
      }

      .ed-bar a,
      .ed-bar button {
        color: #f4efe8;
        text-decoration: none;
        background: #2a241f;
        border: 0;
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
      }

      .ed-bar label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #9a9086;
      }

      .ed-bar input[type="range"] {
        width: 110px;
      }

      .hint {
        margin-left: auto;
        color: #9a9086;
      }

      .tune {
        position: relative;
      }

      .tune summary {
        padding: 7px 11px;
        border-radius: 8px;
        background: #2a241f;
        cursor: pointer;
        list-style: none;
      }

      .tune summary::-webkit-details-marker {
        display: none;
      }

      .tune-panel {
        position: absolute;
        right: 0;
        bottom: 42px;
        display: grid;
        gap: 12px;
        width: 270px;
        padding: 14px;
        border: 1px solid #3b342e;
        border-radius: 10px;
        background: rgba(28, 25, 22, 0.98);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }

      .tune-panel label {
        display: grid;
        grid-template-columns: 1fr auto;
      }

      .tune-panel input {
        grid-column: 1 / -1;
        width: 100% !important;
      }

      .tune-panel output {
        color: #f4efe8;
      }

      .ed-work {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100svh;
        padding: 16px 16px 68px;
        overflow: hidden;
        background: #161310;
      }

      .tape-frame {
        position: relative;
        width: 800px;
        height: 400px;
        flex-shrink: 0;
        overflow: hidden;
        background-image: url("../../assets/stickers/bg.png");
        background-size: var(--paper-w) var(--paper-h);
        background-repeat: repeat;
        transform-origin: center center;
        box-shadow: 0 0 0 1px #3a332c;
        touch-action: none;
      }

      #tape {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      .tape-title {
        position: absolute;
        left: 50px;
        top: 48px;
        z-index: 2;
        pointer-events: none;
        font-family: "Gochi Hand", cursive;
        font-size: 184px;
        font-weight: 400;
        line-height: 0.8;
        color: var(--red);
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="edit-page">
    <header class="ed-bar">
      <strong>Create tape</strong>
      <a href="../">Hero editor</a>
      <a href="../../">View site</a>
      <label>tape width <input id="sz" type="range" min="40" max="150" value="96" /></label>
      <label>opacity <input id="ink" type="range" min="4" max="55" value="26" /></label>
      <label>texture <input id="tex" type="range" min="50" max="250" value="165" /></label>
      <details class="tune">
        <summary>Streak settings</summary>
        <div class="tune-panel">
          <label>
            mean length <output id="streak-len-out">88 px</output>
            <input id="streak-len" type="range" min="30" max="180" value="88" />
          </label>
          <label>
            mean width <output id="streak-width-out">3.5 px</output>
            <input
              id="streak-width"
              type="range"
              min="1"
              max="12"
              step="0.5"
              value="3.5"
            />
          </label>
        </div>
      </details>
      <button id="undo" type="button">Undo</button>
      <button id="clear" type="button">Clear</button>
      <button id="save" type="button">Save</button>
      <span class="hint">Each drag adds to one tape shape · overlaps keep one opacity</span>
    </header>
    <main class="ed-work">
      <div class="tape-frame">
        <canvas id="tape" width="1600" height="800"></canvas>
        <h1 class="tape-title">You're<br />Invited!</h1>
      </div>
    </main>
    <script src="../../js/tape.js"></script>
  </body>
</html>
