<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit hero</title>
    <link rel="stylesheet" href="../css/hero.css" />
    <style>
      body {
        color: #f4efe8;
        font: 13px/1.3 system-ui, sans-serif;
      }

      .ed-bar {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 44px;
        padding: 0 14px;
        background: rgba(28, 25, 22, 0.92);
        border: 1px solid #2e2924;
        border-radius: 10px;
      }

      .ed-bar a,
      .ed-bar button {
        color: #f4efe8;
        text-decoration: none;
        background: #2a241f;
        border: 0;
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
      }

      .ed-bar strong {
        letter-spacing: 0.02em;
      }

      #text-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 8px;
      }

      #text-tools[hidden] {
        display: none;
      }

      #text-tools button {
        background: #2a241f;
      }

      #text-tools button.on {
        background: #8a0807;
      }

      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        padding: 0;
        border: 2px solid #3a332c;
      }

      .swatch.on {
        border-color: #fff;
      }

      #ed-color {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }

      .hero {
        margin-bottom: calc(-2 * var(--tear));
        z-index: 1;
      }

      .edit-page .sticker,
      .edit-page [data-edit] {
        pointer-events: auto;
        cursor: grab;
      }

      .edit-page [data-edit][contenteditable="true"] {
        cursor: text;
        outline: 1px dashed #4f8cff;
      }

      #handles {
        position: absolute;
        z-index: 80;
        border: 1.5px solid #4f8cff;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
        pointer-events: none;
        transform-origin: center center;
      }

      #handles[hidden] {
        display: none;
      }

      .h,
      .rot {
        position: absolute;
        pointer-events: auto;
        background: #fff;
        border: 1.5px solid #4f8cff;
      }

      .h {
        width: 9px;
        height: 9px;
        margin: -5px 0 0 -5px;
        cursor: nwse-resize;
      }

      .h.nw { left: 0; top: 0; }
      .h.ne { left: 100%; top: 0; cursor: nesw-resize; }
      .h.sw { left: 0; top: 100%; cursor: nesw-resize; }
      .h.se { left: 100%; top: 100%; }

      .rot {
        left: 50%;
        top: -28px;
        width: 10px;
        height: 10px;
        margin-left: -6px;
        border-radius: 50%;
        cursor: grab;
      }

      .rot::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 10px;
        width: 1px;
        height: 16px;
        background: #4f8cff;
      }

      .hint {
        margin-left: auto;
        color: #9a9086;
      }
    </style>
  </head>
  <body class="edit-page">
    <header class="ed-bar">
      <strong>Hero editor</strong>
      <a href="../">View site</a>
      <button id="ed-reset" type="button">Reset</button>
      <div id="text-tools" hidden>
        <button type="button" data-font="Gochi Hand">Gochi</button>
        <button type="button" data-font="Cup Cakes">Cup Cakes</button>
        <button type="button" data-font="handwriting-8">handwriting-8</button>
        <button type="button" class="swatch" data-swatch="#1c1410" style="background:#1c1410"></button>
        <button type="button" class="swatch" data-swatch="#8a0807" style="background:#8a0807"></button>
        <button type="button" class="swatch" data-swatch="#ffffff" style="background:#fff"></button>
        <button type="button" class="swatch" data-swatch="#c9a227" style="background:#c9a227"></button>
        <input id="ed-color" type="color" value="#1c1410" />
      </div>
      <span class="hint">Drag to move · corners resize · top knob rotates · double-click text</span>
    </header>

    <main class="ed-work">
      <section class="hero">
        <div class="stage">
          <div class="placed sticker s-disco-l" data-edit="sticker" data-name="disco-l">
            <img src="../assets/stickers/pub-l9qXM.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-disco-r" data-edit="sticker" data-name="disco-r">
            <img src="../assets/stickers/pub-l9qXM.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-spark-d" data-edit="sticker" data-name="spark-d">
            <img src="../assets/stickers/sparkle_double.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-kids" data-edit="sticker" data-name="kids">
            <img src="../assets/stickers/torn_hats.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-dog" data-edit="sticker" data-name="dog">
            <img src="../assets/stickers/pub-fMtLE.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-megaphone" data-edit="sticker" data-name="megaphone">
            <img src="../assets/stickers/9a34e636.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-cherries" data-edit="sticker" data-name="cherries">
            <img src="../assets/stickers/fba9579f.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-kiss" data-edit="sticker" data-name="kiss">
            <img src="../assets/canva/pub-DiO-U.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-spark-3" data-edit="sticker" data-name="spark-3">
            <img src="../assets/stickers/sparkle_single.png" alt="" draggable="false" />
          </div>
          <div class="placed sticker s-star-2" data-edit="sticker" data-name="star-2">
            <img src="../assets/stickers/star.png" alt="" draggable="false" />
          </div>
          <p class="placed note note-1" data-edit="text" data-name="note-1">hi it's</p>
          <p class="placed note note-our" data-edit="text" data-name="note-our">our</p>
          <p class="placed note note-bday" data-edit="text" data-name="note-bday">bday<span class="note-mark" aria-hidden="true"><span class="note-mark-shape note-mark-heart"></span></span></p>
          <p class="placed note note-2" data-edit="text" data-name="note-2">hope u can</p>
          <p class="placed note note-make" data-edit="text" data-name="note-make">make it<span class="note-mark" aria-hidden="true"><span class="note-mark-shape note-mark-smile"></span></span></p>
          <h1 class="placed title" data-edit="text" data-name="title">It's our<br />birthday!</h1>
          <div class="placed hl" data-edit="sticker" data-name="highlight">
            <img class="hl-asset" src="../assets/stickers/4006a28c.png" alt="" draggable="false" />
            <p class="hl-top" data-edit="text" data-name="hl-top">CELEBRATE WITH US</p>
            <p class="hl-bot" data-edit="text" data-name="hl-bot">12/09/2026</p>
          </div>
          <div id="handles" hidden>
            <b class="h nw"></b>
            <b class="h ne"></b>
            <b class="h sw"></b>
            <b class="h se"></b>
            <b class="rot"></b>
          </div>
        </div>
      </section>
    </main>

    <section class="body">
      <div></div>
    </section>

    <svg class="tear-shadow" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="body-onto-hero" x="-4%" y="-80%" width="108%" height="200%">
          <feOffset dy="-2" />
          <feGaussianBlur stdDeviation="1.1" />
          <feColorMatrix
            type="matrix"
            values="0 0 0 0 0.20
                    0 0 0 0 0.14
                    0 0 0 0 0.09
                    0 0 0 0.28 0"
          />
        </filter>
      </defs>
      <path id="tear-shadow-path" fill="#000" filter="url(#body-onto-hero)" />
    </svg>

    <script src="../js/layout.js"></script>
    <script>
      Bday.bootHero();
    </script>
    <script src="../js/editor.js"></script>
  </body>
</html>
